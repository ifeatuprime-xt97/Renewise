<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ReneWise Checkout</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg: #090B10;
      --accent: #0098EA;
      --text: #ffffff;
      --text-muted: rgba(255,255,255,0.6);
      --border: rgba(255,255,255,0.08);
      --success: #2ecc71;
      --danger: #e74c3c;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      /* Scrollable column — prevents card clipping on small screens (iPhone SE etc.) */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 24px 16px 40px;
    }

    /* ── Card ── */
    .checkout-card {
      background: rgba(18, 22, 32, 0.95); /* solid fallback for Android WebView without backdrop-filter */
      border: 1px solid var(--border);
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      padding: 28px 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      text-align: center;
      position: relative;
      isolation: isolate;
    }

    /* backdrop-filter only where supported — progressive enhancement */
    @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
      .checkout-card {
        background: rgba(18, 22, 32, 0.75);
        -webkit-backdrop-filter: blur(20px);
        backdrop-filter: blur(20px);
      }
    }

    /* Subtle top glow — real element, not pseudo, avoids iOS stacking-context tap bugs */
    .card-glow {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(0,152,234,0.14) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Every direct child of the card sits above the glow */
    .checkout-card > *:not(.card-glow) {
      position: relative;
      z-index: 1;
    }

    /* ── Header ── */
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .merchant-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }
    .order-ref {
      font-size: 11px;
      font-family: 'Courier New', monospace;
      color: var(--accent);
      background: rgba(0,152,234,0.1);
      padding: 3px 8px;
      border-radius: 6px;
    }

    /* ── Amount ── */
    .amount-usd {
      font-size: 40px;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: -1px;
    }
    .amount-crypto {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    /* ── QR ── */
    .qr-container {
      background: #fff;
      padding: 14px;
      border-radius: 14px;
      display: inline-block;
      margin-bottom: 20px;
    }
    #qrcode img, #qrcode canvas { display: block; margin: 0 auto; }

    /* ── Wallet buttons ── */
    .wallets-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .wallets-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .wallet-btn {
      /* Reset */
      -webkit-appearance: none;
      appearance: none;
      border: none;
      outline: none;
      /* Layout */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 13px 8px;
      border-radius: 14px;
      /* Style */
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: #fff;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.2;
      cursor: pointer;
      /* Touch */
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Children must not capture pointer/touch events */
    .wallet-btn > * {
      pointer-events: none;
    }

    /* Active state — works on both Android and iOS */
    .wallet-btn:active,
    .wallet-btn.pressed {
      background: rgba(255,255,255,0.12);
      transform: scale(0.96);
    }

    .wallet-btn.primary {
      grid-column: 1 / -1;
      flex-direction: row;
      gap: 10px;
      padding: 14px 16px;
      background: var(--accent);
      border-color: transparent;
      font-size: 15px;
    }
    .wallet-btn.primary:active,
    .wallet-btn.primary.pressed {
      background: #007ac4;
    }

    .wallet-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      /* Visible placeholder while loading */
      background: rgba(255,255,255,0.08);
    }

    /* ── Status screens ── */
    .status-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }
    .status-screen.active { display: flex; }

    .status-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .status-success { background: rgba(46,204,113,0.1); color: var(--success); }
    .status-error   { background: rgba(231,76,60,0.1);  color: var(--danger);  }

    /* ── Loader ── */
    .loader {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 40px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .polling-note {
      margin-top: 16px;
      font-size: 11px;
      color: rgba(255,255,255,0.25);
    }

    /* ── Powered-by footer ── */
    .powered-by {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      opacity: 0.6;
    }
    .powered-by span {
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .powered-by img { height: 20px; border-radius: 4px; }
    .powered-by strong { font-size: 13px; font-weight: 600; letter-spacing: -0.3px; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <div class="checkout-card">
    <div class="card-glow"></div>

    <div id="loading" class="loader"></div>
    <div id="error-screen" class="status-screen" style="color:var(--danger)">
      Failed to load checkout details.
    </div>

    <!-- ── PENDING ── -->
    <div id="checkout-view" style="display:none">
      <div class="header-row">
        <div class="merchant-name" id="merchant-name">ReneWise Checkout</div>
        <div class="order-ref"     id="order-ref">#---</div>
      </div>

      <div class="amount-usd"    id="amount-usd">$0.00</div>
      <div class="amount-crypto" id="amount-crypto">0 TON</div>

      <div class="qr-container">
        <div id="qrcode"></div>
      </div>

      <p class="wallets-label">Pay with</p>

      <div class="wallets-grid">

        <!-- Tonkeeper (full-width primary) -->
        <button class="wallet-btn primary" data-wallet="tonkeeper">
          <img class="wallet-icon"
               src="https://tonkeeper.com/assets/tonconnect-icon.png"
               alt="Tonkeeper"
               width="36" height="36">
          <span>Open Tonkeeper</span>
        </button>

        <!-- Telegram Wallet -->
        <button class="wallet-btn" data-wallet="telegram">
          <img class="wallet-icon"
               src="https://wallet.tg/images/logo-288.png"
               alt="Telegram Wallet"
               width="36" height="36">
          <span>Telegram Wallet</span>
        </button>

        <!-- MyTonWallet -->
        <button class="wallet-btn" data-wallet="mytonwallet">
          <img class="wallet-icon"
               src="https://mytonwallet.io/img/icon-256x256.png"
               alt="MyTonWallet"
               width="36" height="36">
          <span>MyTonWallet</span>
        </button>

        <!-- Tonhub -->
        <button class="wallet-btn" data-wallet="tonhub">
          <img class="wallet-icon"
               src="https://tonhub.com/tonconnect_logo.png"
               alt="Tonhub"
               width="36" height="36">
          <span>Tonhub</span>
        </button>

      </div>

      <p class="polling-note">Polling for confirmation every 3 seconds…</p>
    </div>

    <!-- ── SUCCESS ── -->
    <div id="success-view" class="status-screen">
      <div class="status-icon status-success">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      </div>
      <h2 style="margin-bottom:8px">Payment Successful</h2>
      <p style="color:var(--text-muted);font-size:14px">
        Your payment has been confirmed on the blockchain.
      </p>
    </div>

    <!-- ── FAILED / EXPIRED ── -->
    <div id="failed-view" class="status-screen">
      <div class="status-icon status-error">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="15" y1="9"  x2="9"  y2="15"/>
          <line x1="9"  y1="9"  x2="15" y2="15"/>
        </svg>
      </div>
      <h2 style="margin-bottom:8px">Payment Failed</h2>
      <p style="color:var(--text-muted);font-size:14px" id="failed-reason">
        This checkout session has expired or failed.
      </p>
    </div>
  </div>

  <div class="powered-by">
    <span>Powered by</span>
    <img src="/logo" alt="ReneWise">
    <strong>ReneWise</strong>
  </div>

  <script>
  (function () {
    'use strict';

    // ─── Telegram WebApp ────────────────────────────────────────────────────
    var TgApp = (window.Telegram && window.Telegram.WebApp) || null;
    if (TgApp) TgApp.ready();

    // Detect iOS (includes iPadOS)
    var isIOS = /iP(hone|od|ad)/.test(navigator.userAgent);
    // Detect Android
    var isAndroid = /Android/.test(navigator.userAgent);

    /**
     * Open a URL in the correct way for the current platform:
     *
     * Inside Telegram (both iOS and Android):
     *   - t.me links  → WebApp.openTelegramLink()  (proper Telegram nav)
     *   - other URLs  → WebApp.openLink()           (system browser / wallet)
     *
     * Outside Telegram (plain browser):
     *   - All URLs    → window.open() with _blank
     *
     * For custom-scheme deep-links (tonkeeper://, mytonwallet://) on iOS we
     * also set window.location.href as the primary call so Safari forwards it
     * to the installed app even when window.open is blocked.
     */
    function openExternal(url) {
      if (TgApp && typeof TgApp.openLink === 'function') {
        // ton:// deep-links: openLink routes to the installed wallet app on
        // both Android and iOS Telegram WebView.
        TgApp.openLink(url);
        return;
      }
      // Outside Telegram — use location.href for custom schemes (ton://)
      // so iOS Safari forwards it to the installed wallet app.
      window.location.href = url;
    }

    // ─── Payment data (set by init) ─────────────────────────────────────────
    var _paymentUrl   = '';
    var _vaultAddr    = '';
    var _requiredNano = 0;

    // ─── Build wallet URL ────────────────────────────────────────────────────
    // All wallets receive the same ton:// deep-link — identical to how the bot
    // sends payment buttons. Telegram's openLink (or the OS on plain browser)
    // routes ton:// to whichever TON wallet the user has installed.
    // No scheme replacement, no t.me/wallet?startattach — just the universal link.
    function walletUrl(which) {
      if (!_paymentUrl) return null;
      return _paymentUrl;
    }

    // ─── Wire up wallet buttons ──────────────────────────────────────────────
    // Use touchend + preventDefault to eliminate the 300 ms iOS click delay
    // and avoid ghost-click issues. Falls back to click for non-touch devices.
    function handleWalletTap(btn) {
      var which = btn.getAttribute('data-wallet');
      var url   = walletUrl(which);
      if (!url) {
        // Visual feedback that something is wrong
        btn.style.opacity = '0.5';
        setTimeout(function () { btn.style.opacity = ''; }, 600);
        return;
      }
      openExternal(url);
    }

    document.querySelectorAll('.wallet-btn').forEach(function (btn) {
      var touchMoved = false;

      btn.addEventListener('touchstart', function () {
        touchMoved = false;
        btn.classList.add('pressed');
      }, { passive: true });

      btn.addEventListener('touchmove', function () {
        touchMoved = true;
        btn.classList.remove('pressed');
      }, { passive: true });

      btn.addEventListener('touchend', function (e) {
        btn.classList.remove('pressed');
        if (!touchMoved) {
          e.preventDefault(); // suppress subsequent click event
          handleWalletTap(btn);
        }
      });

      // Fallback for mouse / desktop
      btn.addEventListener('click', function () {
        handleWalletTap(btn);
      });
    });

    // ─── Charge polling ──────────────────────────────────────────────────────
    var pathParts = window.location.pathname.split('/').filter(Boolean);
    var chargeId  = pathParts[pathParts.length - 1];
    var pollTimer = null;

    function fetchCharge() {
      return fetch('/api/public/checkout/' + chargeId)
        .then(function (r) {
          if (!r.ok) throw new Error('not found');
          return r.json();
        })
        .catch(function () { return null; });
    }

    function showView(name) {
      ['loading', 'checkout-view', 'success-view', 'failed-view', 'error-screen'].forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        if (id === 'loading' || id === 'checkout-view') {
          el.style.display = 'none';
        } else {
          el.classList.remove('active');
        }
      });

      var target = document.getElementById(name);
      if (!target) return;
      if (name === 'loading' || name === 'checkout-view') {
        target.style.display = name === 'loading' ? 'block' : 'block';
      } else {
        target.classList.add('active');
      }
    }

    function renderStatus(charge) {
      if (charge.status === 'completed') {
        showView('success-view');
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }

      } else if (charge.status === 'failed' || charge.status === 'expired') {
        document.getElementById('failed-reason').textContent =
          charge.status === 'expired'
            ? 'This payment link has expired. Please request a new one.'
            : 'Payment failed. Please try again or contact support.';
        showView('failed-view');
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }

      } else {
        showView('checkout-view');
      }
    }

    function init() {
      fetchCharge().then(function (charge) {
        if (!charge) {
          showView('error-screen');
          return;
        }

        _paymentUrl   = charge.payment_url   || '';
        _vaultAddr    = charge.vault_address  || '';
        _requiredNano = charge.required_nano  || 0;

        var amtUsd = (charge.amount_usd_cents / 100).toFixed(2);
        var amtTon = (_requiredNano / 1e9).toFixed(4);

        document.getElementById('amount-usd').textContent    = '$' + amtUsd;
        document.getElementById('amount-crypto').textContent = amtTon + ' TON';
        document.getElementById('order-ref').textContent     = '#' + charge.external_reference;

        if (_paymentUrl) {
          /* global QRCode */
          new QRCode(document.getElementById('qrcode'), {
            text:         _paymentUrl,
            width:        200,
            height:       200,
            colorDark:    '#0d111a',
            colorLight:   '#ffffff',
            correctLevel: QRCode.CorrectLevel.M,
          });
        }

        renderStatus(charge);

        if (charge.status === 'pending') {
          pollTimer = setInterval(function () {
            fetchCharge().then(function (updated) {
              if (updated && updated.status !== 'pending') {
                renderStatus(updated);
              }
            });
          }, 3000);
        }
      });
    }

    init();
  })();
  </script>
</body>
</html>
