<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ReneWise Checkout</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    :root {
      --bg: #090B10;
      --surface: #121620;
      --surface2: #1c2130;
      --accent: #0098EA;
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
      --border: rgba(255, 255, 255, 0.08);
      --success: #2ecc71;
      --danger: #e74c3c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .checkout-card {
      background: rgba(18, 22, 32, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .checkout-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(0, 152, 234, 0.1) 0%, transparent 60%);
      z-index: -1;
      pointer-events: none;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    
    .merchant-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .order-ref {
      font-size: 12px;
      font-family: monospace;
      color: var(--accent);
      background: rgba(0, 152, 234, 0.1);
      padding: 4px 8px;
      border-radius: 6px;
    }

    .amount-usd {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: -1px;
    }
    
    .amount-crypto {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .qr-container {
      background: #ffffff;
      padding: 16px;
      border-radius: 16px;
      display: inline-block;
      margin-bottom: 24px;
    }

    #qrcode img, #qrcode canvas {
      display: block;
      margin: 0 auto;
    }

    /* ── Wallet buttons section ── */
    .wallets-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .wallets-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 0;
    }

    .wallet-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 10px;
      border-radius: 14px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
      user-select: none;
    }

    .wallet-btn:active {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(0.97);
    }

    .wallet-btn.primary {
      background: var(--accent);
      border-color: transparent;
      grid-column: 1 / -1; /* full width */
    }

    .wallet-btn.primary:active {
      background: #007ac4;
    }

    .wallet-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
    }

    /* Status Overlays */
    .status-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }
    .status-screen.active {
      display: flex;
    }
    
    .status-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .status-success { background: rgba(46, 204, 113, 0.1); color: var(--success); }
    .status-error   { background: rgba(231, 76, 60, 0.1);  color: var(--danger);  }

    .loader {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 40px auto;
    }

    .polling-note {
      margin-top: 18px;
      font-size: 12px;
      color: rgba(255,255,255,0.3);
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Telegram WebApp SDK — available when opened inside Telegram, gracefully absent outside -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <div class="checkout-card">
    
    <div id="loading" class="loader"></div>
    <div id="error-screen" class="status-screen" style="color:var(--danger)">Failed to load checkout details.</div>

    <!-- PENDING CHECKOUT -->
    <div id="checkout-view" style="display:none">
      <div class="header-row">
        <div class="merchant-name" id="merchant-name">ReneWise Checkout</div>
        <div class="order-ref" id="order-ref">#---</div>
      </div>
      
      <div class="amount-usd" id="amount-usd">$0.00</div>
      <div class="amount-crypto" id="amount-crypto">0 TON</div>

      <div class="qr-container">
        <div id="qrcode"></div>
      </div>

      <p class="wallets-label">Pay with</p>

      <div class="wallets-grid">
        <!-- Tonkeeper — primary / full-width -->
        <button class="wallet-btn primary" onclick="openWallet('tonkeeper')">
          <div style="display:flex;align-items:center;justify-content:center;gap:10px">
            <img class="wallet-icon"
                 src="https://tonkeeper.com/assets/tonconnect-icon.png"
                 alt="Tonkeeper"
                 onerror="this.style.background='#4B7CF3'">
            <span style="font-size:15px">Open Tonkeeper</span>
          </div>
        </button>

        <!-- Telegram Wallet (@wallet bot) -->
        <button class="wallet-btn" onclick="openWallet('telegram')">
          <img class="wallet-icon"
               src="https://wallet.tg/images/logo-288.png"
               alt="Telegram Wallet">
          <span>Telegram Wallet</span>
        </button>

        <!-- MyTonWallet -->
        <button class="wallet-btn" onclick="openWallet('mytonwallet')">
          <img class="wallet-icon"
               src="https://mytonwallet.io/icon-256.png"
               alt="MyTonWallet">
          <span>MyTonWallet</span>
        </button>

        <!-- Tonhub -->
        <button class="wallet-btn" onclick="openWallet('tonhub')">
          <img class="wallet-icon"
               src="https://tonhub.com/tonconnect_logo.png"
               alt="Tonhub">
          <span>Tonhub</span>
        </button>
      </div>

      <p class="polling-note">Polling for confirmation every 3 seconds…</p>
    </div>

    <!-- SUCCESS -->
    <div id="success-view" class="status-screen">
      <div class="status-icon status-success">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      </div>
      <h2 style="margin-bottom:8px">Payment Successful</h2>
      <p style="color:var(--text-muted);font-size:14px;margin-bottom:24px">Your payment has been confirmed on the blockchain.</p>
    </div>

    <!-- FAILED / EXPIRED -->
    <div id="failed-view" class="status-screen">
      <div class="status-icon status-error">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9"  y1="9" x2="15" y2="15"></line>
        </svg>
      </div>
      <h2 style="margin-bottom:8px">Payment Failed</h2>
      <p style="color:var(--text-muted);font-size:14px" id="failed-reason">This checkout session has expired or failed.</p>
    </div>

  </div>

  <div style="margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:.65">
    <span style="font-size:11px;color:rgba(255,255,255,.5);letter-spacing:.5px;text-transform:uppercase">Powered by</span>
    <img src="/logo" alt="ReneWise" style="height:20px;border-radius:4px">
    <div style="font-size:13px;font-weight:600;letter-spacing:-.3px">ReneWise</div>
  </div>

  <script>
    // ── Telegram WebApp helper (safe — works even when opened in a browser) ──
    const TgApp = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

    // Open a URL: inside Telegram use WebApp.openLink (bypasses in-app browser
    // for ton:// deep-links); outside Telegram fall back to window.open.
    function openExternal(url) {
      if (TgApp && typeof TgApp.openLink === 'function') {
        TgApp.openLink(url, { try_instant_view: false });
      } else {
        window.open(url, '_blank', 'noreferrer');
      }
    }

    // ── Charge data set by init() ──
    let _paymentUrl  = '';  // full ton:// deep-link (includes StateInit)
    let _vaultAddr   = '';  // raw vault address
    let _requiredNano = 0;

    // ─────────────────────────────────────────────────────────────────────────
    // Wallet deep-link map
    //
    // All four wallets accept the standard ton:// transfer URI.
    // We use it for Tonkeeper, GRAM, and MyTonWallet directly.
    //
    // Telegram Wallet (Fragment / @wallet bot) uses the Telegram bot deep-link:
    //   https://t.me/wallet?startattach=...
    // The recommended format is to pass the full payment_url as the parameter
    // so the wallet can parse amount + StateInit from it.
    // ─────────────────────────────────────────────────────────────────────────
    function openWallet(which) {
      let url;
      switch (which) {
        case 'tonkeeper':
          // tonkeeper:// scheme opens the Tonkeeper app directly on mobile
          url = _paymentUrl.startsWith('ton://')
            ? _paymentUrl.replace('ton://', 'tonkeeper://')
            : _paymentUrl;
          break;

        case 'telegram':
          // Telegram @wallet bot deep-link
          url = `https://t.me/wallet?startattach=ton_transfer-${encodeURIComponent(_paymentUrl)}`;
          break;

        case 'mytonwallet':
          // mytonwallet:// scheme on mobile
          url = _paymentUrl.startsWith('ton://')
            ? _paymentUrl.replace('ton://', 'mytonwallet://')
            : _paymentUrl;
          break;

        case 'tonhub':
          // Tonhub uses the standard ton:// URI
          url = _paymentUrl;
          break;

        default:
          url = _paymentUrl;
      }

      if (!url) {
        alert('Payment link not ready yet. Please wait a moment and try again.');
        return;
      }
      openExternal(url);
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Charge loading & polling
    // ─────────────────────────────────────────────────────────────────────────
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const chargeId  = pathParts[pathParts.length - 1];
    
    let pollInterval = null;

    async function fetchCharge() {
      try {
        const res = await fetch(`/api/public/checkout/${chargeId}`);
        if (!res.ok) throw new Error('Not found');
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    function renderStatus(charge) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('checkout-view').style.display = 'none';
      document.getElementById('success-view').classList.remove('active');
      document.getElementById('failed-view').classList.remove('active');

      if (charge.status === 'completed') {
        document.getElementById('success-view').classList.add('active');
        if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
      } else if (charge.status === 'failed' || charge.status === 'expired') {
        const reason = charge.status === 'expired'
          ? 'This payment link has expired. Please request a new one.'
          : 'Payment failed. Please try again or contact support.';
        document.getElementById('failed-reason').textContent = reason;
        document.getElementById('failed-view').classList.add('active');
        if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
      } else {
        document.getElementById('checkout-view').style.display = 'block';
      }
    }

    async function init() {
      const charge = await fetchCharge();
      if (!charge) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error-screen').classList.add('active');
        return;
      }

      // Cache payment data for wallet buttons
      _paymentUrl   = charge.payment_url || '';
      _vaultAddr    = charge.vault_address || '';
      _requiredNano = charge.required_nano || 0;

      // Populate display
      const amtUsd = (charge.amount_usd_cents / 100).toFixed(2);
      const amtTon = (_requiredNano / 1_000_000_000).toFixed(4);
      
      document.getElementById('amount-usd').textContent  = `$${amtUsd}`;
      document.getElementById('amount-crypto').textContent = `${amtTon} TON`;
      document.getElementById('order-ref').textContent   = `#${charge.external_reference}`;

      // Generate QR Code from the full payment_url (includes StateInit payload)
      if (_paymentUrl) {
        new QRCode(document.getElementById('qrcode'), {
          text: _paymentUrl,
          width: 200,
          height: 200,
          colorDark:  '#0d111a',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M,
        });
      }

      renderStatus(charge);

      if (charge.status === 'pending') {
        pollInterval = setInterval(async () => {
          const updated = await fetchCharge();
          if (updated && updated.status !== 'pending') {
            renderStatus(updated);
          }
        }, 3000);
      }
    }

    init();
  </script>
</body>
</html>
